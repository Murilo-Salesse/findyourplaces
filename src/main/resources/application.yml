spring:
  application:
    name: findyourplaces
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

jwt:
  public:
    key: classpath:publicKey.pem
  private:
    key: classpath:privateKey.pem
  issuer: findyourplaces
  expires-in: 3600

geoapify:
  api-key: ${GEOAPIFY_API_KEY}
  base-url: https://api.geoapify.com