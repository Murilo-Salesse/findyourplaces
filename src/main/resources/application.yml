spring:
  application:
    name: findyourplaces

  datasource:
    url: jdbc:postgresql://localhost:3355/findyourplace
    username: yourplace
    password: yourplace
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true