version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: findyourplaces-db
    environment:
      POSTGRES_DB: findyourplace
      POSTGRES_USER: yourplace
      POSTGRES_PASSWORD: yourplace
    ports:
      - "3355:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
